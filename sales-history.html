<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales History — Mithai Counter</title>
<style>
:root {
  --bg: #f7f5f0;
  --card: #ffffff;
  --ink: #1f1d1a;
  --muted: #78736a;
  --line: #e6e2d8;
  --green: #15803d;
  --green2: #e8f5ec;
  --danger: #dc2626;
  --danger-bg: #fee2e2;
  --shadow: 0 4px 14px rgba(0,0,0,0.05);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  padding-bottom: 60px;
}
button, input, select {
  font: inherit;
  color: var(--ink);
  -webkit-text-fill-color: var(--ink);
}
button { cursor: pointer; border: 0; }

.app {
  max-width: 900px;
  margin: 0 auto;
  padding: 16px 16px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0 16px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: #f2dfc7;
  display: grid;
  place-items: center;
  font-size: 24px;
}
h1 { font-size: 20px; font-weight: 800; }
.sub { font-size: 13px; color: var(--muted); }

.top-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.btn {
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 650;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  transition: transform .15s ease, background-color .15s ease;
}
.btn:active { transform: scale(0.96); }
.btn.primary { background: var(--green); color: #fff; }
.btn.ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }
.btn.ghost:hover { background: #fbf9f5; }
.btn-sm { padding: 6px 11px; font-size: 12px; }

/* Filter & Search Bar */
.toolbar {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  margin: 16px 0;
  display: grid;
  gap: 12px;
  box-shadow: var(--shadow);
}
.preset-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}
.preset-row::-webkit-scrollbar { display: none; }
.chip {
  padding: 6px 12px;
  border-radius: 9999px;
  background: #f3f0ea;
  border: 1px solid transparent;
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  transition: all .15s ease;
}
.chip:hover { background: #eae5dc; }
.chip.active {
  background: var(--green);
  color: #fff;
  -webkit-text-fill-color: #fff;
}

.search-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.search-input {
  flex: 1;
  min-width: 200px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  outline: none;
  font-size: 13.5px;
}
.search-input:focus {
  border-color: var(--green);
}
.date-picker {
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  font-size: 12.5px;
  outline: none;
}

/* Summary info bar */
.summary-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 14px 2px 10px;
  font-size: 13px;
  color: var(--muted);
  flex-wrap: wrap;
  gap: 6px;
}
.summary-bar strong {
  color: var(--ink);
  font-size: 14px;
}
.summary-total {
  font-size: 15px;
  font-weight: 800;
  color: var(--green);
}

/* Sales List */
.sales-list {
  display: grid;
  gap: 10px;
}
.sale-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  box-shadow: var(--shadow);
  transition: transform .15s ease, border-color .15s ease;
}
.sale-card:hover {
  border-color: #d1cbc0;
}
.sale-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
  gap: 10px;
}
.sale-id {
  font-size: 13.5px;
  font-weight: 750;
  letter-spacing: 0.3px;
}
.sale-time {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}
.sale-amount {
  font-size: 18px;
  font-weight: 800;
  color: var(--green);
  text-align: right;
}

.sale-items-table {
  display: grid;
  gap: 6px;
  padding: 10px 0;
}
.sale-item-line {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
}
.sale-item-qty {
  font-size: 12px;
  color: var(--muted);
  margin-left: 4px;
}

.sale-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
}
.btn-delete {
  background: #fdf2f2;
  color: var(--danger);
  border: 1px solid #fecaca;
}
.btn-delete:hover { background: #fee2e2; }

/* Empty state */
.empty-state {
  background: var(--card);
  border: 1px dashed var(--line);
  border-radius: 16px;
  padding: 40px 20px;
  text-align: center;
  color: var(--muted);
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(70px);
  background: #1f1d1a;
  color: #fff;
  padding: 10px 18px;
  border-radius: 9999px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  opacity: 0;
  transition: all .25s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 1000;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Modal Overlay & Gestures */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(23, 20, 15, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .3s ease, visibility .3s ease;
}
.overlay.show { opacity: 1; visibility: visible; pointer-events: auto; }
.overlay.closing { opacity: 0 !important; visibility: visible !important; pointer-events: none !important; transition: opacity .28s ease !important; }

.modal-box {
  background: #fff;
  width: 100%;
  max-width: 520px;
  border-radius: 24px 24px 0 0;
  padding: 10px 18px calc(24px + env(safe-area-inset-bottom));
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 -12px 40px rgba(0,0,0,0.18);
  transform: translateY(105%);
  transition: transform .36s cubic-bezier(.22,1,.36,1);
  will-change: transform;
  touch-action: pan-y;
}
.overlay.show .modal-box { transform: translateY(0); }
.overlay.closing .modal-box { transform: translateY(100vh) !important; transition: transform .28s cubic-bezier(.32,.72,0,1) !important; }

@media(min-width: 640px) {
  .overlay { align-items: center; padding: 20px; }
  .modal-box {
    border-radius: 24px;
    transform: translateY(45px) scale(.96);
    transition: transform .32s cubic-bezier(.22,1,.36,1), opacity .32s ease;
  }
  .overlay.show .modal-box { transform: translateY(0) scale(1); }
  .overlay.closing .modal-box { transform: translateY(100vh) !important; }
}

.handle-wrap {
  padding: 6px 0 12px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: grab;
  touch-action: none;
}
.handle {
  height: 5px;
  width: 44px;
  border-radius: 6px;
  background: #d8d3c7;
}
.handle-cue {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 4px;
  opacity: 0;
  transition: opacity .2s ease;
}
.handle-wrap:hover .handle-cue, .modal-box.dragging .handle-cue { opacity: 0.85; }
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  touch-action: none;
}
.close-modal {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #f2f0eb;
  font-size: 18px;
  display: grid;
  place-items: center;
  border: 0;
  cursor: pointer;
}

/* Printable Receipt */
.receipt-paper {
  background: #fff;
  border: 1px dashed #bbb;
  padding: 18px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 13px;
  line-height: 1.4;
  color: #000;
  border-radius: 8px;
  margin: 10px 0;
}
.receipt-paper h2 { text-align: center; font-size: 17px; font-weight: 800; margin-bottom: 4px; }
.receipt-paper .center { text-align: center; }
.receipt-paper .divider { border-bottom: 1px dashed #777; margin: 8px 0; }
.receipt-paper .row { display: flex; justify-content: space-between; }
.receipt-paper .bold { font-weight: bold; }

@media print {
  body * { visibility: hidden; }
  #printableReceipt, #printableReceipt * { visibility: visible; }
  #printableReceipt {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    margin: 0;
    padding: 10px;
    border: none;
  }
}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="logo">🍬</div>
      <div>
        <h1>Sales History</h1>
        <div class="sub">Review past counter orders and receipts</div>
      </div>
    </div>
    <div class="top-actions">
      <a href="index.html" class="btn primary">💳 Billing Counter</a>
      <a href="manage.html" class="btn ghost">⚙️ Manage Sweets</a>
      <button class="btn ghost" id="refreshBtn" title="Refresh sales records">🔄 Refresh</button>
    </div>
  </header>

  <!-- Filters & Search Toolbar -->
  <div class="toolbar">
    <!-- Preset chips -->
    <div class="preset-row">
      <button class="chip active" data-preset="today">Today</button>
      <button class="chip" data-preset="yesterday">Yesterday</button>
      <button class="chip" data-preset="week">Last 7 Days</button>
      <button class="chip" data-preset="month">This Month</button>
      <button class="chip" data-preset="all">All Time</button>
      <button class="chip" data-preset="custom">Custom Range</button>
    </div>

    <!-- Date inputs (visible on custom) -->
    <div id="customDateRow" style="display:none;gap:10px;align-items:center;flex-wrap:wrap">
      <label style="font-size:12px;font-weight:700;color:var(--muted)">From:</label>
      <input type="date" id="dateFrom" class="date-picker">
      <label style="font-size:12px;font-weight:700;color:var(--muted)">To:</label>
      <input type="date" id="dateTo" class="date-picker">
      <button class="btn ghost btn-sm" id="applyCustomDate">Apply</button>
    </div>

    <!-- Search & Export -->
    <div class="search-row">
      <input id="searchInput" class="search-input" placeholder="Search sweet name or order ID...">
      <button class="btn ghost" id="exportCsvBtn" title="Export sales to CSV">📄 Export CSV</button>
      <button class="btn ghost" id="printLedgerBtn" title="Print sales summary">🖨️ Print</button>
    </div>
  </div>

  <!-- Summary Line -->
  <div class="summary-bar">
    <span id="summaryText">Loading sales…</span>
    <span class="summary-total" id="summaryTotal"></span>
  </div>

  <!-- Sales Transactions List -->
  <div class="sales-list" id="salesContainer">
    <div class="empty-state">Loading sales records…</div>
  </div>

</div>

<!-- Printable Receipt Modal -->
<div class="overlay" id="receiptOverlay">
  <div class="modal-box">
    <div class="handle-wrap" title="Drag down or scroll down to close"><div class="handle"></div><div class="handle-cue">↓ scroll or drag down to close</div></div>
    <div class="modal-head">
      <h3 style="font-size:17px">Receipt</h3>
      <button class="close-modal" id="closeReceiptBtn">✕</button>
    </div>
    <div id="receiptContent"></div>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn primary" style="flex:1" id="printReceiptBtn">🖨️ Print Receipt</button>
      <button class="btn ghost" id="closeReceiptBtn2">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Background Sales Service -->
<script src="sales-cloud.js"></script>

<script>
/* ========================================================
   SIMPLE SALES HISTORY CONTROLLER
   ======================================================== */
const $ = id => document.getElementById(id);
const money = n => '₹' + (Number(n) || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

let allSales = [];
let activePreset = 'today';
let searchQuery = '';
let customFrom = '', customTo = '';

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function formatWeight(qty, unit) {
  if (unit !== 'kg') return `${qty} ${unit}`;
  const totalGrams = Math.round(Number(qty) * 1000);
  const kg = Math.floor(totalGrams / 1000);
  const g = totalGrams % 1000;
  if (kg === 0) return `${g} g`;
  if (g === 0) return `${kg} kg`;
  return `${kg} kg ${g} g`;
}

function getDateRange(preset) {
  const now = new Date();
  const format = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const todayStr = format(now);

  if (preset === 'today') return { from: todayStr, to: todayStr };
  if (preset === 'yesterday') {
    const y = new Date(now);
    y.setDate(y.getDate() - 1);
    const yStr = format(y);
    return { from: yStr, to: yStr };
  }
  if (preset === 'week') {
    const w = new Date(now);
    w.setDate(w.getDate() - 6);
    return { from: format(w), to: todayStr };
  }
  if (preset === 'month') {
    const m = new Date(now.getFullYear(), now.getMonth(), 1);
    return { from: format(m), to: todayStr };
  }
  if (preset === 'custom') {
    return { from: customFrom || '1970-01-01', to: customTo || '2099-12-31' };
  }
  return { from: '1970-01-01', to: '2099-12-31' };
}

async function loadSales() {
  $('summaryText').textContent = 'Loading sales…';
  try {
    const sales = await SalesCloud.getSales();
    allSales = sales;
    render();
  } catch (err) {
    console.error('Failed to load sales:', err);
    $('salesContainer').innerHTML = `
      <div class="empty-state">
        <h3>Could not load sales records</h3>
        <p style="margin-top:6px">${esc(err.message)}</p>
        <button class="btn primary" style="margin-top:12px" onclick="loadSales()">Retry</button>
      </div>
    `;
    $('summaryText').textContent = 'Error loading records';
  }
}

function getFilteredSales() {
  const range = getDateRange(activePreset);
  const q = searchQuery.toLowerCase().trim();

  return allSales.filter(sale => {
    const sDate = sale.date || (sale.timestamp ? sale.timestamp.split('T')[0] : '');
    if (sDate < range.from || sDate > range.to) return false;

    if (q) {
      const matchId = String(sale.id || '').toLowerCase().includes(q);
      const matchItems = Array.isArray(sale.items) && sale.items.some(i => (i.name || '').toLowerCase().includes(q));
      if (!matchId && !matchItems) return false;
    }

    return true;
  });
}

function render() {
  const filtered = getFilteredSales();
  const totalAmount = filtered.reduce((sum, s) => sum + (s.total || 0), 0);
  const count = filtered.length;

  $('summaryText').textContent = `Showing ${count} order${count === 1 ? '' : 's'}`;
  $('summaryTotal').textContent = `Total: ${money(totalAmount)}`;

  const container = $('salesContainer');

  if (!filtered.length) {
    container.innerHTML = `
      <div class="empty-state">
        <h3>No sales recorded</h3>
        <p style="margin-top:4px">No orders found for the selected period.</p>
      </div>
    `;
    return;
  }

  container.innerHTML = filtered.map(sale => {
    const formattedId = sale.id && sale.id.startsWith('sale_')
      ? '#ORD-' + sale.id.replace('sale_', '').slice(0, 8).toUpperCase()
      : (sale.id ? '#' + sale.id : '');

    return `
      <div class="sale-card">
        <div class="sale-header">
          <div>
            <div class="sale-id">${esc(formattedId)}</div>
            <div class="sale-time">${esc(sale.date || '')} ${esc(sale.time || '')}</div>
          </div>
          <div class="sale-amount">${money(sale.total)}</div>
        </div>

        <div class="sale-items-table">
          ${(sale.items || []).map(i => `
            <div class="sale-item-line">
              <div>
                <strong>${esc(i.name)}</strong>
                <span class="sale-item-qty">(${formatWeight(i.qty, i.unit)})</span>
              </div>
              <div>${money(i.amount)}</div>
            </div>
          `).join('')}
        </div>

        <div class="sale-footer">
          <button class="btn ghost btn-sm" onclick="showReceipt('${esc(sale.id)}')">🧾 Receipt</button>
          <button class="btn btn-delete btn-sm" onclick="deleteSale('${esc(sale.id)}')">🗑️ Delete</button>
        </div>
      </div>
    `;
  }).join('');
}

function showReceipt(saleId) {
  const sale = allSales.find(s => String(s.id) === String(saleId));
  if (!sale) return;

  const formattedId = sale.id.startsWith('sale_')
    ? '#ORD-' + sale.id.replace('sale_', '').slice(0, 8).toUpperCase()
    : '#' + sale.id;

  $('receiptContent').innerHTML = `
    <div class="receipt-paper" id="printableReceipt">
      <h2>ROYAL MITHAI COUNTER</h2>
      <div class="center" style="font-size:11px;color:#555">Authentic Sweets & Desi Ghee</div>
      <div class="divider"></div>
      <div class="row"><span>Order ID:</span><b>${esc(formattedId)}</b></div>
      <div class="row"><span>Date:</span><span>${esc(sale.date)} ${esc(sale.time)}</span></div>
      <div class="divider"></div>
      ${(sale.items || []).map(i => `
        <div class="row">
          <span>${esc(i.name)} (${formatWeight(i.qty, i.unit)})</span>
          <span>${money(i.amount)}</span>
        </div>
      `).join('')}
      <div class="divider"></div>
      <div class="row bold" style="font-size:15px">
        <span>TOTAL:</span>
        <span>${money(sale.total)}</span>
      </div>
      <div class="divider"></div>
      <div class="center" style="margin-top:8px">Thank You! Visit Again!</div>
    </div>
  `;

  openModal('receiptOverlay');
}

async function deleteSale(saleId) {
  if (!confirm('Delete this sale record?')) return;
  try {
    toast('Deleting…');
    await SalesCloud.deleteSale(saleId);
    allSales = allSales.filter(s => String(s.id) !== String(saleId));
    render();
    toast('Sale entry deleted');
  } catch (err) {
    alert('Failed to delete sale: ' + err.message);
  }
}

function exportCSV() {
  const filtered = getFilteredSales();
  if (!filtered.length) { toast('No sales to export'); return; }

  let csv = 'Order ID,Date,Time,Sweet Name,Quantity,Unit,Rate,Item Amount,Order Total\n';
  filtered.forEach(s => {
    const formattedId = s.id ? (s.id.startsWith('sale_') ? 'ORD-' + s.id.replace('sale_', '').slice(0, 8).toUpperCase() : s.id) : '';
    (s.items || []).forEach(i => {
      csv += `"${formattedId}","${s.date}","${s.time}","${(i.name||'').replace(/"/g,'""')}","${i.qty}","${i.unit}","${i.rate}","${i.amount}","${s.total}"\n`;
    });
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `mithai_sales_${activePreset}_${SalesCloud.getTodayDate()}.csv`;
  a.click();
  toast('Sales CSV downloaded');
}

/* Modal Gesture & Dismissal Engine */
function animateAndCloseModal(overlayEl, box, onDone) {
  if (!overlayEl || overlayEl.dataset.closing === 'true') return;
  overlayEl.dataset.closing = 'true';
  overlayEl.classList.add('closing');

  if (box) {
    box.style.transition = 'transform 0.28s cubic-bezier(0.32, 0.72, 0, 1)';
    box.style.transform = 'translateY(100vh)';
  }

  setTimeout(() => {
    overlayEl.classList.remove('show');
    overlayEl.classList.remove('closing');
    overlayEl.dataset.closing = 'false';
    if (box) {
      box.style.transition = '';
      box.style.transform = '';
      box.classList.remove('dragging');
    }
    overlayEl.style.transition = '';
    overlayEl.style.backgroundColor = '';
    if (typeof onDone === 'function') onDone();
  }, 280);
}

function openModal(id) {
  const el = $(id);
  if (!el) return;
  const box = el.querySelector('.modal-box');
  if (box) {
    box.style.transition = '';
    box.style.transform = '';
    box.classList.remove('dragging');
  }
  el.style.transition = '';
  el.style.backgroundColor = '';
  el.classList.remove('closing');
  el.dataset.closing = 'false';
  el.classList.add('show');
}

function closeModal(id) {
  const el = $(id);
  if (!el || !el.classList.contains('show') || el.dataset.closing === 'true') return;
  const box = el.querySelector('.modal-box');
  animateAndCloseModal(el, box);
}

function setupModalGestures(overlayEl) {
  const box = overlayEl.querySelector('.modal-box');
  if (!box) return;

  let startY = 0;
  let currentY = 0;
  let isDragging = false;
  let startTime = 0;
  let isFromHandleOrHead = false;
  let wheelAccumulatedY = 0;
  let wheelTimer = null;

  function getY(e) {
    return e.touches && e.touches.length ? e.touches[0].clientY : e.clientY;
  }

  function startDrag(e) {
    if (e.type === 'mousedown' && e.button !== 0) return;
    if (overlayEl.dataset.closing === 'true') return;
    if (e.target.closest('button, input, select, textarea, a, .btn')) return;

    const handleWrap = e.target.closest('.handle-wrap, .handle');
    const head = e.target.closest('.modal-head');
    isFromHandleOrHead = Boolean(handleWrap || head);

    if (!isFromHandleOrHead && box.scrollTop > 2) return;

    startY = getY(e);
    currentY = startY;
    startTime = Date.now();
    isDragging = false;
  }

  function moveDrag(e) {
    if (startY === 0) return;
    currentY = getY(e);
    const dy = currentY - startY;

    if (!isFromHandleOrHead && box.scrollTop > 2) return;

    if (dy > 3) {
      if (!isDragging) {
        isDragging = true;
        box.classList.add('dragging');
        box.style.transition = 'none';
        overlayEl.style.transition = 'none';
      }

      if (e.cancelable) e.preventDefault();

      const translateY = Math.max(0, dy);
      box.style.transform = `translateY(${translateY}px)`;

      const progress = Math.min(1, translateY / (box.offsetHeight || 420));
      overlayEl.style.backgroundColor = `rgba(23, 20, 15, ${Math.max(0.04, 0.55 * (1 - progress * 0.85))})`;

      const halfHeight = (box.offsetHeight || 400) * 0.45;
      if (translateY > halfHeight) {
        isDragging = false;
        startY = 0;
        box.classList.remove('dragging');
        animateAndCloseModal(overlayEl, box);
      }
    } else if (dy < 0 && isFromHandleOrHead) {
      box.style.transform = `translateY(${dy * 0.2}px)`;
    }
  }

  function endDrag(e) {
    if (startY === 0) return;
    const dy = currentY - startY;
    const duration = Math.max(1, Date.now() - startTime);
    const velocity = dy / duration;

    box.classList.remove('dragging');

    if (isDragging) {
      isDragging = false;
      startY = 0;

      const halfDownThreshold = Math.min((box.offsetHeight || 400) * 0.35, 120);

      if (dy >= halfDownThreshold || (dy > 35 && velocity > 0.25)) {
        animateAndCloseModal(overlayEl, box);
      } else {
        box.style.transition = 'transform 0.32s cubic-bezier(0.175, 0.885, 0.32, 1.25)';
        box.style.transform = '';
        overlayEl.style.transition = 'background-color 0.28s ease';
        overlayEl.style.backgroundColor = '';
        setTimeout(() => {
          box.style.transition = '';
          overlayEl.style.transition = '';
        }, 340);
      }
    } else {
      startY = 0;
    }
  }

  box.addEventListener('touchstart', startDrag, { passive: true });
  box.addEventListener('touchmove', moveDrag, { passive: false });
  box.addEventListener('touchend', endDrag);
  box.addEventListener('touchcancel', endDrag);

  box.addEventListener('mousedown', startDrag);
  window.addEventListener('mousemove', e => { if (startY !== 0) moveDrag(e); });
  window.addEventListener('mouseup', e => { if (startY !== 0) endDrag(e); });

  box.addEventListener('wheel', e => {
    if (overlayEl.dataset.closing === 'true') return;

    const isHandle = e.target.closest('.handle-wrap, .handle');
    const isHead = e.target.closest('.modal-head');
    const atTop = box.scrollTop <= 1;
    const isContentScrollable = (box.scrollHeight - box.clientHeight) > 15;

    const isScrollingDown = e.deltaY > 0;
    const isTrackpadPullDown = atTop && e.deltaY < -15;

    if (isHandle || isHead || (!isContentScrollable && isScrollingDown) || (atTop && (isScrollingDown || isTrackpadPullDown))) {
      const delta = isTrackpadPullDown ? Math.abs(e.deltaY) : e.deltaY;
      if (delta > 0) wheelAccumulatedY += delta * 0.75;

      if (wheelAccumulatedY > 8) {
        if (e.cancelable) e.preventDefault();
        box.classList.add('dragging');
        box.style.transition = 'none';
        box.style.transform = `translateY(${wheelAccumulatedY}px)`;

        const progress = Math.min(1, wheelAccumulatedY / (box.offsetHeight || 420));
        overlayEl.style.backgroundColor = `rgba(23, 20, 15, ${Math.max(0.04, 0.55 * (1 - progress * 0.85))})`;

        const halfThreshold = Math.min((box.offsetHeight || 400) * 0.35, 120);

        if (wheelAccumulatedY >= halfThreshold) {
          wheelAccumulatedY = 0;
          clearTimeout(wheelTimer);
          animateAndCloseModal(overlayEl, box);
          return;
        }

        clearTimeout(wheelTimer);
        wheelTimer = setTimeout(() => {
          if (overlayEl.dataset.closing !== 'true') {
            wheelAccumulatedY = 0;
            box.classList.remove('dragging');
            box.style.transition = 'transform 0.32s cubic-bezier(0.175, 0.885, 0.32, 1.25)';
            box.style.transform = '';
            overlayEl.style.transition = 'background-color 0.28s ease';
            overlayEl.style.backgroundColor = '';
            setTimeout(() => {
              box.style.transition = '';
              overlayEl.style.transition = '';
            }, 340);
          }
        }, 220);
      }
    }
  }, { passive: false });
}

document.querySelectorAll('.overlay').forEach(o => {
  setupModalGestures(o);
  o.addEventListener('click', e => { if (e.target === o) closeModal(o.id); });
});

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const openOverlay = document.querySelector('.overlay.show');
    if (openOverlay) closeModal(openOverlay.id);
  }
});

/* Event Listeners */
document.querySelectorAll('[data-preset]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('[data-preset]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activePreset = btn.dataset.preset;
    $('customDateRow').style.display = activePreset === 'custom' ? 'flex' : 'none';
    render();
  };
});

$('applyCustomDate').onclick = () => {
  customFrom = $('dateFrom').value;
  customTo = $('dateTo').value;
  if (!customFrom || !customTo) { toast('Choose both from and to dates'); return; }
  render();
};

$('searchInput').oninput = e => { searchQuery = e.target.value; render(); };
$('exportCsvBtn').onclick = exportCSV;
$('printLedgerBtn').onclick = () => window.print();
$('refreshBtn').onclick = loadSales;
$('closeReceiptBtn').onclick = () => closeModal('receiptOverlay');
$('closeReceiptBtn2').onclick = () => closeModal('receiptOverlay');
$('printReceiptBtn').onclick = () => window.print();

window.addEventListener('focus', loadSales);
loadSales();
</script>
