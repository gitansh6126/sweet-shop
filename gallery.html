<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Mithai Sweet Shop - Asset Gallery</title>
  <style>
    :root {
      --primary: #d97706;
      --bg: #fffbeb;
      --card-bg: #ffffff;
      --text: #1f2937;
    }
    html {
      scroll-behavior: smooth;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
    }
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    header h1 {
      color: #92400e;
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    header p {
      color: #78350f;
      font-size: 1.1rem;
    }
    .badge-count {
      display: inline-block;
      margin-top: 0.75rem;
      background: #fde68a;
      color: #92400e;
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      max-width: 1300px;
      margin: 0 auto;
    }
    @keyframes cardEnter {
      0% { opacity: 0; transform: translateY(16px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease;
      display: flex;
      flex-direction: column;
      animation: cardEnter 0.32s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 20px -3px rgba(146, 64, 14, 0.15);
    }
    .img-wrap {
      width: 100%;
      height: 220px;
      background: #f3f4f6;
      overflow: hidden;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .card:hover .img-wrap img {
      transform: scale(1.05);
    }
    .info {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .category {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #d97706;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 0.5rem;
    }
    .desc {
      font-size: 0.9rem;
      color: #4b5563;
      line-height: 1.4;
      margin-bottom: 1rem;
      flex: 1;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid #f3f4f6;
      font-size: 0.8rem;
      color: #6b7280;
    }
    .filename {
      font-family: monospace;
      background: #f3f4f6;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Royal Mithai Sweet Shop</h1>
    <p>Premium High-Resolution Assets & Sweet Catalog</p>
    <div style="margin-top: 1rem; display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap;">
      <a href="index.html" style="text-decoration: none; background: #246b4b; color: #fff; padding: 0.5rem 1.25rem; border-radius: 9999px; font-weight: 600; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 6px;">
        💳 Open Billing Counter
      </a>
      <a href="sales-history.html" style="text-decoration: none; background: #fff; color: #374151; border: 1px solid #d1d5db; padding: 0.5rem 1.25rem; border-radius: 9999px; font-weight: 600; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 6px;">
        📊 Sales History
      </a>
      <span class="badge-count">24 Major Mithai Varieties Ready</span>
    </div>
  </header>

  <div class="gallery" id="gallery"></div>

  <script>
    fetch('sweets_catalog.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('gallery');
        data.sweets.forEach((sweet, index) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.style.animationDelay = `${Math.min(index * 20, 240)}ms`;
          card.innerHTML = `
            <div class="img-wrap">
              <img src="${sweet.image_file}" alt="${sweet.name}" loading="lazy">
            </div>
            <div class="info">
              <div class="category">${sweet.category}</div>
              <div class="title">${sweet.name}</div>
              <div class="desc">${sweet.description}</div>
              <div class="meta">
                <span class="filename">${sweet.image_file.split('/')[1]}</span>
                <span>${sweet.size_kb} KB</span>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => console.error(err));
  </script>
</body>
</html>
